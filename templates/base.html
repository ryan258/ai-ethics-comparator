<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title | default("AI Ethics Comparator") }}</title>

    <!-- Factories (System Fonts) -->
    <!-- Removed external Google Fonts to reduce supply-chain risk -->

    <!-- HTMX (Locally Vendored) -->
    <script src="/static/vendor/htmx/htmx.min.js"></script>
    <script src="/static/vendor/htmx/json-enc.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="/static/css/style.css" />

    {% block head %}{% endblock %}
  </head>

  <body>
    <header>
      <div class="container">
        <h1>AI Ethics Comparator</h1>
        <p style="color: var(--accent-primary)">
          Compare model responses under controlled prompt conditions
        </p>
        {% set current_page_name = current_page | default("single_run") %}
        <nav style="margin-top: 1rem; display: flex; gap: 1rem;">
            <a href="/" style="color: {% if current_page_name == 'single_run' %}var(--accent-primary){% else %}var(--text-color){% endif %}; text-decoration: none; padding-bottom: 0.25rem; border-bottom: 2px solid {% if current_page_name == 'single_run' %}var(--accent-primary){% else %}transparent{% endif %};">Single Run</a>
            <a href="/experiments" style="color: {% if current_page_name == 'laboratory' %}var(--accent-primary){% else %}var(--text-color){% endif %}; text-decoration: none; padding-bottom: 0.25rem; border-bottom: 2px solid {% if current_page_name == 'laboratory' %}var(--accent-primary){% else %}transparent{% endif %};">Laboratory</a>
        </nav>
      </div>
    </header>

    <div id="request-error" class="container error" role="alert" tabindex="-1"></div>
    <main class="container">{% block content %}{% endblock %}</main>

    <footer
      class="container"
      style="
        text-align: center;
        margin-top: 4rem;
        opacity: 1;
        font-size: 0.8rem;
      "
    >
      <p>Powered by Python, FastAPI & HTMX</p>
    </footer>

    <!-- Global Interactions -->
    <script>
      document.addEventListener("htmx:responseError", function (event) {
        let message = "The request failed. Please try again.";
        try { const body = JSON.parse(event.detail.xhr.responseText); message = typeof body.detail === "string" ? body.detail : "Please check the form values."; } catch {}
        const error = document.getElementById("request-error"); error.textContent = message; error.focus();
      });
      document.addEventListener("htmx:beforeRequest", function (event) {
        const element = event.detail.elt;
        if (element.classList.contains("result-item") && (element.querySelector("dialog[open], details[open]") || element.contains(document.activeElement))) {
          if (event.detail.requestConfig?.triggeringEvent?.type !== "refresh") event.preventDefault();
        }
      });
      document.addEventListener("input", function (event) {
        const target = event.target;
        if (!target.dataset.filterList) return;
        const group = document.getElementById(target.dataset.filterList);
        for (const label of group.querySelectorAll(".choice-list label")) label.hidden = !label.textContent.toLowerCase().includes(target.value.toLowerCase());
      });
      document.addEventListener("click", function (e) {
        // Accordion Handler (Delegated for HTMX content)
        if (e.target.closest(".accordion-header")) {
          const accordion = e.target.closest(".accordion");
          if (accordion) {
            accordion.classList.toggle("open");
          }
        }
      });
    </script>
  </body>
</html>
