
[project]
name = "ai-ethics-comparator"
version = "6.1.0"
description = "Local-first research tool for repeated LLM ethics experiments and executive brief generation."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "jinja2",
    "markdown",
    "markupsafe",
    "openai",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    "python-pptx",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv]
package = false

[tool.ruff.lint]
select = ["F", "E9", "ASYNC", "S", "UP", "I"]
# UP046: PEP 695 type parameters would mean rewriting the executive_reporting
# generics for style alone. Deliberate; revisit if those classes change anyway.
ignore = ["UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105"]  # asserts are the point; "token" keys are not passwords
"scripts/*" = ["S101"]
