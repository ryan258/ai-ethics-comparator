name: CI

on:
  push:
    branches: [main, v5]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned exactly: astral-sh stopped publishing a floating major tag
      # after v7, so there is no `@v10` to track.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Lint
        run: uvx --from ruff==0.15.8 ruff check .  # rule set lives in pyproject.toml

      - name: Core measurement typing
        run: uvx --with pydantic --from mypy==1.18.2 mypy lib/measurements.py lib/prompt_contract.py --follow-imports=silent

      - name: Tests
        run: uv run pytest -q

      # The docs make checkable numeric claims. Drift is what these commits keep
      # reintroducing, so assert them rather than trusting a review pass.
      - name: Doc claims match reality
        run: uv run python scripts/check_doc_claims.py
